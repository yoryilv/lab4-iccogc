# ════════════════════════════════════════════
#  Flask Lab – Docker Compose
#  Servicios: db (PostgreSQL 15) + web (Flask)
# ════════════════════════════════════════════

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: flasklab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-flaskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flaskpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-flasklab}
    volumes:
      # Persistent data volume
      - postgres_data:/var/lib/postgresql/data
      # Seed script runs on first initialization
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flaskuser} -d ${POSTGRES_DB:-flasklab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flasklab_net

  # ── Flask Web Application ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flasklab_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the service name 'db'
      DATABASE_URL: postgresql://${POSTGRES_USER:-flaskuser}:${POSTGRES_PASSWORD:-flaskpassword}@db:5432/${POSTGRES_DB:-flasklab}
      POSTGRES_HOST: db
    ports:
      - "5001:5000"
    volumes:
      # Flask session files
      - flask_sessions:/tmp/flask_session
      # Live code reload: mount source so changes take effect without rebuild
      - .:/app
    networks:
      - flasklab_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: flasklab_postgres_data
  flask_sessions:
    name: flasklab_sessions

# ── Networks ─────────────────────────────────────────────────────────
networks:
  flasklab_net:
    name: flasklab_network
    driver: bridge
